[package]
name = "hearth-fireplace"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Fireplace: the one server that knows who people are"

# src/lib.rs is a library as well, so the tests can drive the router without
# binding a port.

# Short, because people type it and read it in a task list.
[[bin]]
name = "fireplace"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
argon2 = "0.6.0"
hearth-protocol.workspace = true
# Pictures are decoded and re-encoded, never stored as sent (src/avatar.rs).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
axum = "0.8.9"
base64 = "0.23.1"
# rustls with ring and webpki roots only: no OpenSSL, no aws-lc, no CMake, so
# the build stays pure Rust (docs/ORACLE.md).
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "io-util", "net"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["fs", "timeout"] }
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
# ServiceExt::oneshot: one request through the router, no socket.
tower = { version = "0.5.3", features = ["util"] }
