[workspace]
resolver = "3"
members = ["server/hearth-protocol", "server/hearth-server", "server/hearth-server-gui", "client/hearth-client"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
hearth-protocol = { version = "0.1.0", path = "server/hearth-protocol" }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "net"] }
