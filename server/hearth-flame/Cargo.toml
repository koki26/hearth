[package]
name = "hearth-flame"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A Flame: one Hearth game server, hosted by anybody"

# Short, because people type it and read it in a task list.
[[bin]]
name = "flame"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
bytes = "1.12.1"
hearth-protocol.workspace = true
quinn.workspace = true
rcgen = "0.14.10"
ring = "0.17.14"
rustls.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "fs", "io-util"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.5"

[dev-dependencies]
ring = "0.17.14"
