[package]
name = "hearth-flame-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The window a Flame runs in"

[[bin]]
name = "flame-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
hearth-flame = { version = "0.1.0", path = "../hearth-flame" }
hearth-protocol.workspace = true
quinn.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
