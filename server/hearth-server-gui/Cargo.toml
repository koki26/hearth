[package]
name = "hearth-server-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Desktop front end for the Hearth relay server"

[dependencies]
anyhow.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
hearth-server = { version = "0.1.0", path = "../hearth-server" }
quinn.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
