# GitBook Git Sync: the whole site. One space, read from docs/
# (README.md is its cover, SUMMARY.md its sidebar -- GitBook's default names).
$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Hearth
  structure:
    - type: space
      key: hearth-docs   # GitBook matches the space by this; never change it
      title: Hearth
      path: docs
      default: true
      content:
        directory: ./docs
