[package]
name = "hearth-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hearth VR client: Godot 4 GDExtension over the Hearth QUIC protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
godot = "0.5.5"
hearth-protocol.workspace = true
opus = "0.4.0"
quinn.workspace = true
ring = "0.17.14"
rustls.workspace = true
serde_json = "1.0.154"
tokio.workspace = true
ureq = { version = "3.5", features = ["json"] }

[dev-dependencies]
hearth-flame = { path = "../../server/hearth-flame" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
